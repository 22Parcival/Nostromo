<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>blog.parcival.fr - Nostromo</title>
  
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="./css/style.css">
  
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
</head>
<body>
  
  <div class="bg-grid-pattern" aria-hidden="true"></div>

  
  <header class="os-status-bar">
    <div class="status-left">
      <a href="https://parcival.fr" class="btn-terminal-back" target="_blank" rel="noopener">
        <span class="terminal-arrow">←</span>
        <span>parcival.fr/home</span>
      </a>
      <div class="status-divider"></div>
      <div class="site-branding">
        <span class="status-indicator"></span>
        <span class="site-title">blog.parcival.fr</span>
        <span class="tag-version">v1.0</span>
      </div>
    </div>

    <div class="status-right">
      <div class="search-box-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="post-search" placeholder="rechercher un article..." autocomplete="off" spellcheck="false">
        <span class="search-kbd">/</span>
      </div>
    </div>
  </header>

  
  <main id="app" class="main-layout">
    
  </main>

  
  <div id="article-modal" class="os-modal-backdrop" aria-hidden="true">
    <div class="os-window article-window" role="dialog" aria-modal="true">
      <div class="os-titlebar">
        <div class="os-controls">
          <button class="os-circle os-close" id="modal-close-btn" aria-label="Fermer la fenêtre"></button>
          <button class="os-circle os-minimize" aria-label="Minimiser"></button>
          <button class="os-circle os-maximize" aria-label="Agrandir"></button>
        </div>
        <div class="os-title" id="modal-window-title">article.md</div>
        <div class="os-actions">
          <button class="btn-copy-link" id="modal-share-btn" title="Copier le lien de l'article">
            <span>share</span>
          </button>
        </div>
      </div>
      <div class="os-window-content" id="modal-content">
        
      </div>
    </div>
  </div>

  <script src="./js/blog.js"></script>
</body>
</html>
