<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Nostromo Studio — Panel Auteur & Admin</title>
  
  <script>
    (function() {
      const saved = localStorage.getItem('nostromo_theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>

  <link rel="stylesheet" href="./admin.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header">
    <div class="header-left">
      <a href="/" target="_blank" class="brand-link" title="Ouvrir le blog public">
        <span class="brand-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
        </span>
        <span class="brand-title">Nostromo</span>
        <span class="brand-badge">Studio</span>
      </a>
      <a href="/" target="_blank" class="btn btn-ghost btn-sm" title="Voir le blog public dans un nouvel onglet">
        <span>Voir le site</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
    </div>

    <div class="header-right">
      <!-- Theme Switcher (Dark / Light) -->
      <button id="theme-toggle" class="btn btn-ghost btn-icon" type="button" aria-label="Changer le thème (sombre / clair)" title="Basculer entre mode sombre et clair">
        <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <div class="divider-vertical"></div>

      <!-- User Profile Pill -->
      <div class="user-profile" id="user-info">
        <span class="user-loading">Chargement...</span>
      </div>
    </div>
  </header>

  <!-- Studio Layout -->
  <div class="studio-layout">
    <!-- Sidebar: Posts List -->
    <aside class="studio-sidebar">
      <div class="sidebar-top">
        <div class="sidebar-headline">
          <h2 id="sidebar-title" class="sidebar-title">Articles</h2>
          <button id="new-post-btn" class="btn btn-primary btn-sm" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Nouveau</span>
          </button>
        </div>

        <div class="search-box">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="search" id="posts-search" placeholder="Filtrer les articles..." autocomplete="off">
        </div>

        <div id="filter-tabs" class="filter-tabs" style="display: none;">
          <button class="filter-tab active" data-filter="mine" type="button">Mes articles</button>
          <button class="filter-tab" data-filter="all" type="button">Tous les articles</button>
        </div>
      </div>

      <ul id="posts-list" class="posts-list">
        <!-- Rendered by admin.js -->
      </ul>
    </aside>

    <!-- Main Workspace -->
    <main class="studio-main">
      <form id="post-form" class="editor-container">
        <input type="hidden" id="post-id">

        <!-- Context Bar -->
        <div class="editor-action-bar">
          <div class="action-bar-left">
            <div id="post-author-banner" class="author-status-pill" style="display: none;"></div>
            <span id="save-status-indicator" class="save-indicator"></span>
          </div>

          <div class="action-bar-right">
            <!-- Mode d'affichage éditeur : Écrit / Aperçu / Scindé -->
            <div class="view-mode-tabs" role="group" aria-label="Mode de travail">
              <button type="button" class="view-mode-tab" data-mode="write" title="Uniquement le texte">Rédiger</button>
              <button type="button" class="view-mode-tab active" data-mode="split" title="Écran scindé">Scindé</button>
              <button type="button" class="view-mode-tab" data-mode="preview" title="Aperçu rendu final">Aperçu</button>
            </div>

            <button type="button" id="delete-btn" class="btn btn-danger btn-sm" style="display: none;">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              <span>Supprimer</span>
            </button>

            <button type="submit" id="save-btn" class="btn btn-primary btn-sm">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
              <span>Enregistrer</span>
              <kbd class="shortcut-kbd">Ctrl+S</kbd>
            </button>
          </div>
        </div>

        <!-- Article Headline -->
        <div class="editor-headline-area">
          <input type="text" id="title" class="title-input" required placeholder="Titre de l'article..." autocomplete="off">
        </div>

        <!-- Meta Section (Collapsible details) -->
        <details class="meta-accordion" open>
          <summary class="meta-accordion-header">
            <span class="meta-title">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
              Paramètres & Métadonnées
            </span>
            <span class="meta-hint">Statut, slug URL, couverture & résumé</span>
          </summary>

          <div class="meta-accordion-body">
            <div class="meta-grid">
              <div class="meta-field">
                <label for="status">Statut de publication</label>
                <select id="status" class="form-select">
                  <option value="draft">Brouillon (Non visible)</option>
                  <option value="published">Publié (En ligne)</option>
                </select>
              </div>

              <div class="meta-field">
                <label for="slug">Slug d'URL personnalisé</label>
                <div class="input-with-prefix">
                  <span class="input-prefix">#/article/</span>
                  <input type="text" id="slug" placeholder="généré-automatiquement" spellcheck="false">
                </div>
              </div>
            </div>

            <div class="meta-field">
              <label for="cover-image">Image de couverture</label>
              <div class="cover-input-group">
                <input type="text" id="cover-image" placeholder="/uploads/nom.png ou https://..." class="form-input">
                <label for="cover-file-input" class="btn btn-secondary btn-sm" style="cursor: pointer;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                  <span>Téléverser</span>
                </label>
                <input type="file" id="cover-file-input" accept="image/*" style="display: none;">
              </div>
              <div id="cover-preview-wrapper" class="cover-thumbnail-preview" style="display: none;">
                <img id="cover-preview-img" src="" alt="Aperçu couverture">
                <button type="button" id="remove-cover-btn" class="btn-remove-cover" title="Retirer la couverture">✕</button>
              </div>
            </div>

            <div class="meta-field">
              <label for="summary">Résumé court (carte d'accueil)</label>
              <textarea id="summary" rows="2" class="form-textarea" placeholder="Un extrait accrocheur pour la page d'accueil..."></textarea>
            </div>
          </div>
        </details>

        <!-- Markdown Formatting Toolbar -->
        <div class="markdown-toolbar">
          <div class="toolbar-group">
            <button type="button" class="tool-btn" data-tool="bold" title="Gras (Ctrl+B)"><strong>B</strong></button>
            <button type="button" class="tool-btn" data-tool="italic" title="Italique (Ctrl+I)"><em>I</em></button>
            <button type="button" class="tool-btn" data-tool="h2" title="Titre de section">H2</button>
            <button type="button" class="tool-btn" data-tool="h3" title="Sous-titre">H3</button>
            <span class="tool-separator"></span>
            <button type="button" class="tool-btn" data-tool="link" title="Insérer un lien">🔗</button>
            <button type="button" class="tool-btn" data-tool="quote" title="Citation">❝</button>
            <button type="button" class="tool-btn" data-tool="code" title="Bloc de code">&lt;/&gt;</button>
            <button type="button" class="tool-btn" data-tool="list" title="Liste à puces">• Liste</button>
          </div>

          <div class="toolbar-group">
            <span id="upload-status" class="upload-indicator" style="display: none;"></span>
            <label for="image-file-input" class="tool-btn tool-btn-primary" style="cursor: pointer;" title="Insérer une image">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
              <span>Image</span>
            </label>
            <input type="file" id="image-file-input" accept="image/*" style="display: none;">
            <span class="tool-separator"></span>
            <span id="word-count" class="word-counter">0 mots</span>
          </div>
        </div>

        <!-- Split / Single Workspace -->
        <div id="split-workspace" class="split-workspace mode-split">
          <div class="pane pane-editor">
            <textarea id="content" class="content-textarea" required placeholder="# Commencez à écrire...&#10;&#10;💡 Vous pouvez également glisser-déposer ou coller (Ctrl+V) des images directement ici."></textarea>
          </div>

          <div class="pane pane-preview">
            <div id="preview" class="preview-output markdown-body"></div>
          </div>
        </div>
      </form>
    </main>
  </div>

  <script src="./admin.js"></script>
</body>
</html>
